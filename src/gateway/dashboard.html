<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wicket</title>
<style nonce="__NONCE__">
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6673; --line: #e3e6eb;
    --accent: #2f5bea; --ok: #1a7f4b; --warn: #a15c00; --bad: #b42318;
    --ok-bg: #e6f4ec; --warn-bg: #fdf0dc; --bad-bg: #fde8e6; --bar: #dfe4ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #98a2b0; --line: #262c35;
      --accent: #7b9bff; --ok: #5fd39a; --warn: #f0b45a; --bad: #ff8a80;
      --ok-bg: #12301f; --warn-bg: #33250d; --bad-bg: #3a1714; --bar: #262c35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  header .sub { color: var(--muted); }
  header .spacer { flex: 1; }
  main { padding: 20px 24px 40px; max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .tile { padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .panel h2 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .panel h2 .count { color: var(--muted); font-weight: 400; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 18px 16px; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.neutral { background: var(--bar); color: var(--muted); }
  .bar { height: 6px; width: 110px; background: var(--bar); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .bar.hot > span { background: var(--bad); }
  button { font: inherit; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 12px; cursor: pointer; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.deny { color: var(--bad); border-color: var(--bad); }
  input { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); width: 260px; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .approval { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .approval:last-child { border-bottom: none; }
  .approval .what { flex: 1; min-width: 0; }
  .approval .args { color: var(--muted); overflow-wrap: anywhere; }
  .gate { padding: 60px 24px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Wicket</h1>
  <span class="sub">policy gateway for AI agents</span>
  <span class="spacer"></span>
  <span id="chain"></span>
  <input id="token" type="password" placeholder="Admin token" autocomplete="off" aria-label="Admin token">
  <button id="connect">Connect</button>
</header>

<div id="gate" class="gate">Enter the admin token to load the dashboard.</div>

<main id="app" hidden>
  <section class="tiles" id="tiles"></section>

  <section class="panel">
    <h2>Approval queue <span class="count" id="approvals-count"></span></h2>
    <div id="approvals"></div>
  </section>

  <section class="panel">
    <h2>Agents</h2>
    <table>
      <thead><tr><th>Agent</th><th>Team</th><th>Models</th><th>Spend this month</th><th class="num">Rate / min</th><th></th></tr></thead>
      <tbody id="agents"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Recent requests</h2>
    <table>
      <thead><tr><th>Time</th><th>Agent</th><th>Model</th><th>Outcome</th><th class="num">Tokens</th><th class="num">Cost</th><th class="num">Latency</th></tr></thead>
      <tbody id="requests"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Audit trail <span class="count" id="audit-note"></span></h2>
    <table>
      <thead><tr><th>#</th><th>Time</th><th>Event</th><th>Actor</th><th>Hash</th></tr></thead>
      <tbody id="audit"></tbody>
    </table>
  </section>
</main>

<script nonce="__NONCE__">
(() => {
  const $ = (id) => document.getElementById(id);
  let token = "";
  let timer = null;

  // A token in the URL fragment (never sent to a server) is used once and removed from the address bar.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
  try {
    token = fromHash || sessionStorage.getItem("wicket-token") || "";
    if (fromHash) history.replaceState(null, "", location.pathname);
  } catch { token = fromHash || ""; }

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") node.className = v; else node.setAttribute(k, v);
    }
    for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return node;
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { authorization: "Bearer " + token, "content-type": "application/json" } });
    if (res.status === 401) throw new Error("unauthorized");
    return res.json();
  }

  const usd = (n) => "$" + (n < 1 ? n.toFixed(4) : n.toFixed(2));
  const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  const OUTCOME = {
    ok: ["ok", "allowed"], redacted: ["warn", "redacted"], blocked_pii: ["bad", "blocked: PII"],
    denied_tool: ["bad", "tool denied"], pending_approval: ["warn", "needs approval"],
    budget_exceeded: ["bad", "over budget"], rate_limited: ["warn", "rate limited"],
    model_denied: ["bad", "model denied"], upstream_error: ["bad", "upstream error"],
  };
  const pill = (outcome) => { const [cls, label] = OUTCOME[outcome] || ["neutral", outcome]; return el("span", { class: "pill " + cls }, label); };

  function fill(id, rows, emptyText, cols) {
    const body = $(id);
    body.replaceChildren();
    if (rows.length === 0) { body.append(el("tr", {}, el("td", { colspan: cols, class: "empty" }, emptyText))); return; }
    rows.forEach((r) => body.append(r));
  }

  function renderTiles(s) {
    const tiles = [
      ["Requests", s.summary.requests], ["Spend", usd(s.summary.spendUsd)], ["Blocked", s.summary.blocked],
      ["Redacted", s.summary.redacted], ["Pending approvals", s.pendingApprovals], ["Agents", s.agents],
    ];
    $("tiles").replaceChildren(...tiles.map(([label, value]) =>
      el("div", { class: "tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value))));
  }

  function renderApprovals(list) {
    $("approvals-count").textContent = list.length ? "(" + list.length + " waiting)" : "";
    const box = $("approvals");
    box.replaceChildren();
    if (list.length === 0) { box.append(el("div", { class: "empty" }, "Nothing is waiting for a decision.")); return; }
    for (const a of list) {
      const calls = a.toolCalls.map((c) => c.name + " " + JSON.stringify(c.args)).join("; ");
      const reason = a.toolCalls.map((c) => c.reason).join("; ");
      const approve = el("button", { class: "approve", "data-id": a.id, "data-act": "approve" }, "Approve");
      const deny = el("button", { class: "deny", "data-id": a.id, "data-act": "deny" }, "Deny");
      box.append(el("div", { class: "approval" },
        el("div", { class: "what" }, el("div", {}, el("code", {}, a.agentId), " wants to call"), el("div", { class: "args" }, calls + " (" + reason + ")")),
        el("span", { class: "mono" }, time(a.at)), approve, deny));
    }
  }

  function renderAgents(list) {
    fill("agents", list.map((a) => {
      const budget = a.monthlyBudgetUsd;
      const share = budget ? Math.min(a.spentThisMonthUsd / budget, 1) : 0;
      const spend = el("td", {});
      if (budget) {
        const fillBar = el("span", {});
        fillBar.style.width = Math.round(share * 100) + "%"; // CSSOM is allowed by the CSP, inline style attributes are not
        spend.append(el("span", { class: "bar" + (share >= 0.9 ? " hot" : "") }, fillBar),
          usd(a.spentThisMonthUsd) + " of " + usd(budget));
      } else spend.append(usd(a.spentThisMonthUsd) + " (no limit)");
      return el("tr", {},
        el("td", {}, a.name), el("td", {}, a.team),
        el("td", {}, a.allowedModels ? a.allowedModels.join(", ") : "any"),
        spend, el("td", { class: "num" }, a.ratePerMinute ?? "none"),
        el("td", {}, a.disabled ? el("span", { class: "pill bad" }, "disabled") : el("span", { class: "pill ok" }, "active")));
    }), "No agents yet.", 6);
  }

  function renderRequests(list) {
    fill("requests", list.slice(0, 15).map((r) => el("tr", {},
      el("td", { class: "mono" }, time(r.at)), el("td", {}, r.agentName || r.agentId), el("td", {}, r.model || "-"),
      el("td", {}, pill(r.outcome)),
      el("td", { class: "num" }, (r.promptTokens ?? 0) + (r.completionTokens ?? 0)),
      el("td", { class: "num" }, usd(r.costUsd)), el("td", { class: "num" }, r.latencyMs + " ms"))), "No requests yet.", 7);
  }

  function renderAudit(events, verify) {
    $("chain").replaceChildren(verify.ok
      ? el("span", { class: "pill ok" }, "audit chain intact (" + verify.checked + ")")
      : el("span", { class: "pill bad" }, "audit chain BROKEN at #" + verify.brokenAt));
    $("audit-note").textContent = "each event includes the hash of the one before it";
    fill("audit", events.slice(0, 12).map((e) => el("tr", {},
      el("td", { class: "mono" }, e.seq), el("td", { class: "mono" }, time(e.at)), el("td", {}, el("code", {}, e.type)),
      el("td", {}, e.actor), el("td", { class: "mono" }, e.hash.slice(0, 12)))), "No events yet.", 5);
  }

  async function refresh() {
    try {
      const [summary, approvals, agents, requests, audit, verify] = await Promise.all([
        api("/admin/summary"), api("/admin/approvals?status=pending"), api("/admin/agents"),
        api("/admin/requests?limit=15"), api("/admin/audit?limit=12"), api("/admin/audit/verify"),
      ]);
      $("gate").hidden = true; $("app").hidden = false;
      renderTiles(summary); renderApprovals(approvals.approvals); renderAgents(agents.agents);
      renderRequests(requests.requests); renderAudit(audit.events, verify);
    } catch (err) {
      $("app").hidden = true; $("gate").hidden = false;
      $("gate").textContent = err.message === "unauthorized" ? "That admin token was not accepted." : "Could not reach the gateway.";
      clearInterval(timer); timer = null;
    }
  }

  function connect() {
    token = $("token").value.trim() || token;
    try { sessionStorage.setItem("wicket-token", token); } catch {}
    $("token").value = "";
    clearInterval(timer);
    refresh();
    timer = setInterval(refresh, 3000);
  }

  $("connect").addEventListener("click", connect);
  $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
  $("approvals").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-id]");
    if (!btn) return;
    btn.disabled = true;
    await api("/admin/approvals/" + btn.dataset.id + "/" + btn.dataset.act, { method: "POST", body: "{}" });
    refresh();
  });

  if (token) connect();
})();
</script>
</body>
</html>
